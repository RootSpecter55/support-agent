services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: support
    ports:
      - '${POSTGRES_HOST_PORT:-5451}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d support']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-off job: applies migrations and seeds the fake shop, then exits.
  migrate:
    build: .
    command: ['sh', '-c', 'alembic upgrade head && python -m scripts.seed']
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/support
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/support
      SECRETS_SOURCE: local
    ports:
      - '${API_HOST_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
